# One recurring task. Enrichment jobs are enqueued by the ingest pipeline, not
# on a schedule — but a worker that dies without deregistering leaves its
# claimed execution dead-lettered and its record stuck at `enqueued`, which
# nothing else releases (docs/DECISIONS.md D-024). The sweep reconciles those.
# Its cadence is deliberately slow: sweeping is cheap, re-enqueueing spends
# budget, so an entity that keeps failing must not be retried more than a few
# times an hour.
#
# A `schedule:` entry here is all it takes — the Solid Queue supervisor starts
# a scheduler whenever recurring tasks are configured, so config/queue.yml
# needs no change. The unique (task_key, run_at) index keeps one fire per
# interval however many schedulers run.
development:
  enrichment_sweep:
    class: EnrichmentSweepJob
    queue: enrichment
    schedule: every 15 minutes
    description: Release enrichment claims stranded by a dead worker

# Never in the suite: specs drive EnrichmentSweep directly, and a scheduler
# would race them.
test: {}
