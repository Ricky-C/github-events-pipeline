# Compose defaults boot a fresh clone with zero manual steps and no .env file.
# POSTGRES_PASSWORD is a compose-internal default, not a real credential
# (docs/THREAT-MODEL.md threat 6) — the db is not reachable from the host.

x-app: &app
  # Shared image name: one build/tag serves every app service instead of
  # compose tagging an identical image per service.
  image: github-events-pipeline-app
  build: .
  environment: &app-env
    RAILS_ENV: development
    # Connection pieces are passed discretely (read by config/database.yml)
    # rather than as a DATABASE_URL, so the password never travels through
    # URL parsing and RAILS_ENV alone selects the database (docs/DECISIONS.md D-012).
    PGHOST: db
    PGUSER: postgres
    PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}

services:
  db:
    image: postgres:16
    environment:
      # The postgres image applies this only while initializing an empty
      # db-data volume — changing it after first boot breaks app auth until
      # `docker compose down -v` recreates the volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No host port mapping by design: nothing outside the compose network
    # needs the db (docs/THREAT-MODEL.md threat 7).
    healthcheck:
      # -h 127.0.0.1 forces TCP: the image's first-run initdb starts a
      # socket-only temporary server that would otherwise pass this check
      # before the real server is listening on 5432.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      # Probe fast only while starting; the check exists for startup
      # ordering, so steady-state probing every 5s buys nothing.
      start_period: 30s
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 5

  # The ONLY service that touches migrations — one-shot, so concurrent
  # services can never race each other running schema changes.
  migrate:
    <<: *app
    command: bin/rails db:prepare
    depends_on:
      db:
        condition: service_healthy

  # Continuous poll loop: honors X-Poll-Interval, parks until reset when
  # rate-limited, capped backoff on DB-shaped errors. A permanent error or
  # an exhausted failure streak exits nonzero on purpose so the restart
  # policy below can recycle the container (D-026).
  ingester:
    <<: *app
    command: ["bin/rails", "runner", "IngestRunner.new.run"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Solid Queue supervisor (dispatcher + one enrichment worker + the sweep
  # scheduler, per config/queue.yml and config/recurring.yml).
  #
  # The two timeouts are ordered on purpose. A SIGTERMed worker fork releases
  # its claimed execution only if it deregisters before the supervisor
  # SIGQUITs it; lose that race and the execution is dead-lettered, which
  # loses the enrichment. So the fork gets 20s (config/application.rb) —
  # longer than a worst-case 15s fetch — and compose must not SIGKILL the
  # supervisor before then, which its 10s default would. A hard kill
  # (SIGKILL, OOM) still strands the claim; EnrichmentSweep recovers it
  # (docs/DECISIONS.md D-024).
  worker:
    <<: *app
    command: ["bin/jobs"]
    stop_grace_period: 25s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot ingestion (docker compose run --rm ingest): exactly one poll
  # cycle, no sleep. One-shot is an explicit argument here rather than an
  # env flag so the mode is visible where the service is defined (D-016).
  ingest:
    <<: *app
    command: ["bin/rails", "runner", "IngestRunner.new.run(once: true)"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tools]

  # docker compose run --rm test — prepares its own test database
  # (RAILS_ENV alone selects it via config/database.yml).
  test:
    <<: *app
    environment:
      <<: *app-env
      RAILS_ENV: test
    command: bash -c "bin/rails db:prepare && bundle exec rspec"
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]

  # Console/inspection: docker compose run --rm app bin/rails c
  app:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tools]

volumes:
  db-data:
