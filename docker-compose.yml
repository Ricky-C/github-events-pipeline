# Compose defaults boot a fresh clone with zero manual steps and no .env file.
# POSTGRES_PASSWORD is a compose-internal default, not a real credential
# (docs/THREAT-MODEL.md threat 6) — the db is not reachable from the host.

x-app: &app
  # Shared image name: one build/tag serves every app service instead of
  # compose tagging an identical image per service.
  image: github-events-pipeline-app
  build: .
  environment: &app-env
    RAILS_ENV: development
    # Connection pieces are passed discretely (read by config/database.yml)
    # rather than as a DATABASE_URL, so the password never travels through
    # URL parsing and RAILS_ENV alone selects the database (docs/DECISIONS.md D-012).
    PGHOST: db
    PGUSER: postgres
    PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}

services:
  db:
    image: postgres:16
    environment:
      # The postgres image applies this only while initializing an empty
      # db-data volume — changing it after first boot breaks app auth until
      # `docker compose down -v` recreates the volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No host port mapping by design: nothing outside the compose network
    # needs the db (docs/THREAT-MODEL.md threat 7).
    healthcheck:
      # -h 127.0.0.1 forces TCP: the image's first-run initdb starts a
      # socket-only temporary server that would otherwise pass this check
      # before the real server is listening on 5432.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      # Probe fast only while starting; the check exists for startup
      # ordering, so steady-state probing every 5s buys nothing.
      start_period: 30s
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 5

  # The ONLY service that touches migrations — one-shot, so concurrent
  # services can never race each other running schema changes.
  migrate:
    <<: *app
    command: bin/rails db:prepare
    depends_on:
      db:
        condition: service_healthy

  # Phase 0 stub: proves boot, logging, and service wiring. Replaced by the
  # real poll loop in Phase 1.
  ingester:
    <<: *app
    command: ["bin/rails", "runner", 'loop { Rails.logger.info({component: "ingester", event: "heartbeat.stub", msg: "poll loop arrives in Phase 1"}); sleep 30 }']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Phase 0 stub: Solid Queue and enrichment jobs arrive in Phase 3.
  worker:
    <<: *app
    command: ["bin/rails", "runner", 'Rails.logger.info({component: "worker", event: "worker.stub", msg: "Solid Queue arrives in Phase 3"}); sleep']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot ingestion (docker compose run --rm ingest). Stub until Phase 1.
  ingest:
    <<: *app
    command: ["bin/rails", "runner", 'Rails.logger.info({component: "ingester", event: "ingest.stub", msg: "one-shot ingestion arrives in Phase 1"})']
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tools]

  # docker compose run --rm test — prepares its own test database
  # (RAILS_ENV alone selects it via config/database.yml).
  test:
    <<: *app
    environment:
      <<: *app-env
      RAILS_ENV: test
    command: bash -c "bin/rails db:prepare && bundle exec rspec"
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]

  # Console/inspection: docker compose run --rm app bin/rails c
  app:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tools]

volumes:
  db-data:
